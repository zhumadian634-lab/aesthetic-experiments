<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI WORKSTREAM — 控制台</title>
<style>
:root{
  --bg:#07090C; --panel:#0C1015; --panel2:#0F141B; --line:#1A222C; --line2:#243040;
  --ink:#E8EFF6; --mut:#7C8B9B; --dim:#4B5867;
  --acc:#38E1C6; --acc2:#6FA8FF; --warn:#F5C36B; --bad:#FF6B6B; --ok:#4ADE80;
  --mono:"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --sans:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1200px 600px at 78% -10%, rgba(56,225,198,.10), transparent 60%),
    radial-gradient(900px 500px at 10% 110%, rgba(111,168,255,.08), transparent 60%),
    var(--bg);
  color:var(--ink);font-family:var(--sans);overflow:hidden;
  width:2560px;height:1440px;
}
/* 网格底纹 */
body::before{
  content:"";position:fixed;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:48px 48px;pointer-events:none;
}
.wrap{position:relative;padding:34px 40px 28px;height:100%;display:flex;flex-direction:column;gap:22px}

/* 顶栏 */
.top{display:flex;align-items:center;gap:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.mark{width:44px;height:44px;border:1px solid var(--acc);display:grid;place-items:center;position:relative}
.mark i{width:14px;height:14px;background:var(--acc);display:block;box-shadow:0 0 18px rgba(56,225,198,.7)}
.mark::after{content:"";position:absolute;inset:6px;border:1px solid rgba(56,225,198,.25)}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-size:21px;letter-spacing:.18em;font-weight:600}
.brand span{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.14em}
.pills{display:flex;gap:10px;margin-left:auto;align-items:center}
.pill{font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--mut);
      border:1px solid var(--line2);padding:8px 14px;display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.015)}
.pill b{color:var(--ink);font-weight:500}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.a{background:var(--warn);box-shadow:0 0 10px var(--warn)}
.clock{font-family:var(--mono);font-size:26px;letter-spacing:.06em;color:var(--ink);margin-left:12px;font-variant-numeric:tabular-nums}
.clock small{color:var(--dim);font-size:12px;margin-left:8px;letter-spacing:.2em}

/* 布局 */
.body{flex:1;display:grid;grid-template-columns:220px 1fr;gap:22px;min-height:0}
.rail{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.rail a{display:flex;align-items:center;gap:12px;padding:13px 14px;color:var(--mut);text-decoration:none;
        font-size:13.5px;letter-spacing:.05em;border-left:2px solid transparent}
.rail a.on{color:var(--ink);background:linear-gradient(90deg,rgba(56,225,198,.10),transparent);border-left-color:var(--acc)}
.rail a i{width:14px;height:14px;border:1px solid currentColor;opacity:.8;display:block}
.rail .sp{flex:1}
.rail .foot{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9;letter-spacing:.06em}

.grid{display:grid;gap:18px;min-height:0}

/* 卡片 */
.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);position:relative;overflow:hidden;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;left:0;top:0;width:100%;height:1px;background:linear-gradient(90deg,var(--acc),transparent 55%);opacity:.55}
.ch{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11.5px;letter-spacing:.16em;color:var(--mut)}
.ch b{color:var(--ink);font-weight:500;letter-spacing:.12em}
.ch .r{margin-left:auto;color:var(--dim)}
.cb{padding:18px;flex:1;min-height:0}

/* 指标 */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{padding:16px 18px;border:1px solid var(--line);background:rgba(255,255,255,.012)}
.kpi .lab{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.14em}
.kpi .val{font-size:40px;font-weight:300;letter-spacing:-.01em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1}
.kpi .val u{font-size:15px;color:var(--mut);text-decoration:none;margin-left:6px;letter-spacing:.06em}
.kpi .sub{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:9px;letter-spacing:.06em}
.kpi.g .val{color:var(--acc)} .kpi.b .val{color:var(--acc2)} .kpi.w .val{color:var(--warn)}

/* 管线 */
.flow{display:flex;align-items:stretch;gap:0;height:100%;justify-content:center;flex-direction:column;gap:18px}
.line1,.line2{display:flex;align-items:center;gap:10px}
.arw{flex:0 0 34px;height:1px;background:linear-gradient(90deg,rgba(56,225,198,.15),rgba(56,225,198,.75));position:relative}
.arw::after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid var(--acc);border-right:1px solid var(--acc);transform:rotate(45deg)}
.node{position:relative;width:196px;padding:14px 16px;background:#0A0E13;border:1px solid var(--line2);z-index:2;flex:0 0 196px}
.node .t{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.16em}
.node .n{font-size:14.5px;margin-top:6px;letter-spacing:.04em}
.node .m{font-family:var(--mono);font-size:11px;color:var(--acc);margin-top:8px;letter-spacing:.06em}
.node.act{border-color:rgba(56,225,198,.55);box-shadow:0 0 0 1px rgba(56,225,198,.14),0 0 40px rgba(56,225,198,.10)}
.node .bar{height:2px;background:rgba(255,255,255,.06);margin-top:10px;overflow:hidden}
.node .bar i{display:block;height:100%;background:var(--acc);width:62%}

/* 日志 */
.log{font-family:var(--mono);font-size:12.5px;line-height:1.95;color:var(--mut);overflow:hidden}
.log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .ts{color:var(--dim);margin-right:14px}
.log .ok{color:var(--ok)} .log .ac{color:var(--acc)} .log .wn{color:var(--warn)} .log .bd{color:var(--bad)}

/* 视频墙 */
.wall{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:14px;height:100%}
.tile{position:relative;border:1px solid var(--line2);overflow:hidden;background:
  linear-gradient(180deg,#101A24 0%,#0B1219 46%,#131C25 46%,#080C11 100%)}
.tile .scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);opacity:.6}
.tile::after{content:"";position:absolute;inset:0;background:radial-gradient(60% 60% at 50% 42%,rgba(111,168,255,.10),transparent 70%)}
.tile .face{position:absolute;border:1px solid var(--acc);box-shadow:0 0 22px rgba(56,225,198,.25)}
.tile .face span{position:absolute;top:-22px;left:-1px;font-family:var(--mono);font-size:10.5px;color:#04110E;background:var(--acc);padding:2px 7px;letter-spacing:.1em}
.tile .tc{position:absolute;left:12px;bottom:10px;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.75);letter-spacing:.1em}
.tile .ch2{position:absolute;right:12px;top:10px;font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.12em}
.tile .cap{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:15px;color:#EAF6FF;
  text-shadow:0 2px 18px #000;letter-spacing:.06em}
.tile.live{border-color:rgba(255,107,107,.4)}
.tile.live .rec{position:absolute;left:12px;top:10px;font-family:var(--mono);font-size:10.5px;color:#FFB4B4;letter-spacing:.14em}
.tile.live .rec b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bad);margin-right:6px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.15}}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:11px;color:var(--mut);letter-spacing:.14em;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line2);font-weight:400}
td{padding:13px 12px;border-bottom:1px solid rgba(255,255,255,.045);color:#CBD6E1}
td.mono{font-family:var(--mono);font-size:12px;color:var(--mut)}
.tag{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border:1px solid;letter-spacing:.1em}
.tag.ok{color:var(--ok);border-color:rgba(74,222,128,.35)}
.tag.w{color:var(--warn);border-color:rgba(245,195,107,.35)}
.tag.b{color:var(--acc);border-color:rgba(56,225,198,.35)}
.tag.r{color:var(--bad);border-color:rgba(255,107,107,.35)}

/* 时间线 */
.tl{display:flex;flex-direction:column;gap:0}
.row{display:grid;grid-template-columns:150px 1fr;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.row .nm{font-family:var(--mono);font-size:11.5px;color:var(--mut);letter-spacing:.08em}
.track{position:relative;height:16px;background:rgba(255,255,255,.03)}
.bar2{position:absolute;top:0;height:100%;background:linear-gradient(90deg,rgba(56,225,198,.85),rgba(56,225,198,.35))}
.bar2.b{background:linear-gradient(90deg,rgba(111,168,255,.85),rgba(111,168,255,.3))}
.bar2.w{background:linear-gradient(90deg,rgba(245,195,107,.85),rgba(245,195,107,.3))}

.lab2{font-family:var(--mono);font-size:10.5px;color:var(--mut);letter-spacing:.14em}
.v2{font-size:22px;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:.02em}.scn{position:absolute;inset:0;width:100%;height:100%}
.quote{font-size:15px;line-height:1.85;color:#D6E2EC;letter-spacing:.02em}
.meta{font-family:var(--mono);font-size:10.5px;color:var(--dim);letter-spacing:.12em;margin-top:14px;border-top:1px solid var(--line);padding-top:12px}.footline{display:flex;gap:26px;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.12em;border-top:1px solid var(--line);padding-top:14px}
.footline b{color:var(--mut);font-weight:400}
</style>
</head>

  const d = new Date();

  clock.innerHTML = p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'<small>CST</small>';
}
tick(); setInterval(tick, 1000);
